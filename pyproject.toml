[project]
name = "ml-workflow-to-prod"
version = "0.1.0"
description = "MLOps workflow for a bank marketing propensity model"
requires-python = ">=3.10"
dependencies = [
    "azure-monitor-opentelemetry>=1.6",
    "catboost>=1.2",
    "fastapi>=0.100",
    "pandas>=2.2",
    "uvicorn>=0.23",
]

[dependency-groups]
pipeline = [
    "matplotlib>=3.8",
    "mlflow>=2.0",
    "pandera[pandas]>=0.24",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "shap>=0.46",
    "xgboost>=2.0",
]
dev = [
    "dvc>=3.0",
    "httpx2>=1.0",
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.uv]
package = false
