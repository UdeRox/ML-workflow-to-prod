name: CD

# On every push to main: build the image with the committed model, deploy it to Azure
# as a canary after approval, then mark that model version as @champion.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

# Never run two deployments at the same time: they would fight over the traffic split.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  DAGSHUB_OWNER: ${{ vars.DAGSHUB_OWNER }}
  DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
  APP_NAME: ca-bank-marketing
  RESOURCE_GROUP: rg-mlops-workshop

jobs:
  build:
    if: vars.DAGSHUB_OWNER != ''
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.name.outputs.image }}
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.7"

      - name: Configure DVC access
        run: |
          uv sync --frozen --all-groups
          make dvc-auth

      - name: Download and verify the locked model from DagsHub
        run: |
          set -euo pipefail
          model_md5="$(awk '/path: models\/model.cbm/ { found=1; next } found && /md5:/ { print $2; exit }' dvc.lock)"
          if [ -z "$model_md5" ]; then
            echo "::error::Could not find the model checksum in dvc.lock."
            exit 1
          fi
          MODEL_MD5="$model_md5" uv run python - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          import requests

          owner = os.environ["DAGSHUB_OWNER"]
          token = os.environ["DAGSHUB_TOKEN"]
          expected_md5 = os.environ["MODEL_MD5"]
          url = (
              f"https://dagshub.com/{owner}/ML-workflow-to-prod.dvc/files/md5/"
              f"{expected_md5[:2]}/{expected_md5[2:]}"
          )
          response = requests.get(url, auth=(owner, token), timeout=(15, 90))
          response.raise_for_status()
          actual_md5 = hashlib.md5(response.content, usedforsecurity=False).hexdigest()
          if actual_md5 != expected_md5:
              raise RuntimeError(
                  f"Downloaded model checksum mismatch: expected {expected_md5}, "
                  f"received {actual_md5}"
              )

          model_path = Path("models/model.cbm")
          model_path.parent.mkdir(parents=True, exist_ok=True)
          model_path.write_bytes(response.content)
          print(
              f"Downloaded and verified {model_path} "
              f"({len(response.content)} bytes, MD5 {actual_md5})."
          )
          PY

      - name: Image name (registries need lowercase)
        id: name
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push to GitHub Container Registry
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          TAG: ${{ steps.name.outputs.tag }}
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker build --build-arg MODEL_VERSION="$TAG" -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

  deploy:
    needs: build
    if: vars.AZURE_CLIENT_ID != ''   # skip until the Azure resources exist
    runs-on: ubuntu-24.04
    environment: production          # waits for a reviewer to approve
    env:
      IMAGE: ${{ needs.build.outputs.image }}
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Log in to Azure without a password (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906  # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pin all traffic to the revision that is live now
        run: |
          OLD=$(az containerapp revision list -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query "[?properties.trafficWeight==\`100\`].name | [0]" -o tsv)
          if [ -z "$OLD" ]; then
            OLD=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
              --query properties.latestRevisionName -o tsv)
          fi
          echo "OLD=$OLD" >> "$GITHUB_ENV"
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$OLD=100" -o none
          echo "Live revision: $OLD"

      - name: Start the new revision (it receives 0% of traffic)
        run: |
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --image "$IMAGE:$TAG" --revision-suffix "$TAG" -o none
          echo "NEW=$APP_NAME--$TAG" >> "$GITHUB_ENV"

      - name: Smoke test the new revision on its own URL
        run: |
          FQDN=$(az containerapp revision show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision "$NEW" --query properties.fqdn -o tsv)
          for attempt in $(seq 1 30); do
            if curl -sf "https://$FQDN/health"; then echo; exit 0; fi
            sleep 10
          done
          echo "::error::The new revision never became healthy. Users still see $OLD."
          exit 1

      - name: Canary - 10% of traffic to the new revision
        run: |
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$OLD=90" "$NEW=10" -o none
          sleep 120   # in a real team, check error rates in Application Insights here

      - name: Release - 100% of traffic to the new revision
        run: |
          az containerapp ingress traffic set -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --revision-weight "$NEW=100" -o none
          echo "Rollback, if ever needed: az containerapp ingress traffic set -n $APP_NAME \
            -g $RESOURCE_GROUP --revision-weight $OLD=100" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.7"

      - name: Mark the deployed model as @champion
        env:
          IMAGE: ${{ needs.build.outputs.image }}:${{ needs.build.outputs.tag }}
        run: |
          uv sync --frozen --all-groups
          make dvc-auth
          uv run dvc pull run_info.json
          uv run python -m src.registry promote --image "$IMAGE"
